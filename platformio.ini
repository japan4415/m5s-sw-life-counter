[env:m5stack-stopwatch]
; ESP32-S3 向けプラットフォーム（バージョンをピン留め）
platform = espressif32 @ 6.12.0

; ボード定義（下記の注意事項を参照）
board = esp32s3box

; Arduino Framework を使用
framework = arduino

; 16MB Flash 向けパーティションテーブル
board_build.partitions = default_16MB.csv

; Flash サイズの明示指定
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; PSRAM を Octal モード（OPI）で使用するためのメモリタイプ指定
board_build.arduino.memory_type = qio_opi

; シリアルモニタのボーレート
monitor_speed = 115200

; ビルドフラグ
build_flags =
    -DESP32S3                        ; ESP32-S3 であることを明示
    -DBOARD_HAS_PSRAM                ; PSRAM 搭載ボードであることを宣言
    -DCORE_DEBUG_LEVEL=5             ; デバッグログレベル（5=VERBOSE, 開発中のみ）
    -DARDUINO_USB_CDC_ON_BOOT=1      ; Native USB-CDC を有効にする（シリアル出力の鍵）
    -DARDUINO_USB_MODE=1             ; USB モードを CDC に設定（上記と対で必要）

; ライブラリ依存（バージョンをピン留め）
lib_deps =
    m5stack/M5Unified @ ^0.2.15      ; M5Stack 統合ライブラリ（StopWatch 対応は 0.2.15 以降）
    m5stack/M5GFX @ ^0.2.21          ; グラフィックスライブラリ（StopWatch 対応は 0.2.21 以降）
    https://github.com/m5stack/M5PM1.git   ; 電源管理 IC ドライバ（レジストリ有無未確認のため URL 直指定）
    https://github.com/m5stack/M5IOE1.git  ; IO エキスパンダドライバ — AMOLED・タッチ・バイブが M5IOE1 配下の電源レール(L3B)経由で給電されるため公式 lib_deps に含まれている

; FaB のソースのみ取り込み、EDH 固有のソースを除外する
build_src_filter =
    +<*>
    -<main_edh.cpp>
    -<app/edh_app_controller.*>
    -<ui/edh_renderer.*>
    -<ui/edh_theme.hpp>
    -<infra/edh_storage_nvs.*>

; ============================================================
; EDH（統率者戦）ファームウェア用環境
; ============================================================
; FaB 版とは別ファームウェアとして提供する。
; `pio run -e m5stack-stopwatch-edh` でビルドし、Web Flasher で書き分ける。

[env:m5stack-stopwatch-edh]
; ESP32-S3 向けプラットフォーム（FaB 版と同一バージョン）
platform = espressif32 @ 6.12.0

; ボード定義（FaB 版と同一）
board = esp32s3box

; Arduino Framework
framework = arduino

; 16MB Flash 向けパーティションテーブル
board_build.partitions = default_16MB.csv

; Flash サイズの明示指定
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; PSRAM を Octal モード（OPI）で使用
board_build.arduino.memory_type = qio_opi

; シリアルモニタのボーレート
monitor_speed = 115200

; ビルドフラグ（FaB 版と同一 + EDH 識別フラグ）
build_flags =
    -DESP32S3
    -DBOARD_HAS_PSRAM
    -DCORE_DEBUG_LEVEL=5
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DFIRMWARE_EDH                   ; EDH ファームウェアであることを識別するフラグ

; ライブラリ依存（FaB 版と同一）
lib_deps =
    m5stack/M5Unified @ ^0.2.15
    m5stack/M5GFX @ ^0.2.21
    https://github.com/m5stack/M5PM1.git
    https://github.com/m5stack/M5IOE1.git

; EDH のソースのみ取り込み、FaB 固有のソースを除外する
build_src_filter =
    +<*>
    -<main.cpp>
    -<app/app_controller.*>
    -<ui/renderer.*>
    -<ui/theme.hpp>
    -<infra/storage_nvs.*>

; ============================================================
; [env:m5stack-stopwatch] は FaB 実機ビルド用
; [env:m5stack-stopwatch-edh] は EDH 実機ビルド用
; [env:native] はホスト上でのユニットテスト用である
; ============================================================

; ホストテスト用環境（pio test -e native で実行）
[env:native]
platform = native
build_flags =
    -std=c++17
    -DNATIVE_TEST           ; ハードウェア依存コードを切り替えるフラグ
