[env:m5stack-stopwatch]
; ESP32-S3 向けプラットフォーム（バージョンをピン留め）
platform = espressif32 @ 6.12.0

; ボード定義（下記の注意事項を参照）
board = esp32s3box

; Arduino Framework を使用
framework = arduino

; 16MB Flash 向けパーティションテーブル
board_build.partitions = default_16MB.csv

; Flash サイズの明示指定
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

; PSRAM を Octal モード（OPI）で使用するためのメモリタイプ指定
board_build.arduino.memory_type = qio_opi

; シリアルモニタのボーレート
monitor_speed = 115200

; ビルドフラグ
build_flags =
    -DESP32S3                        ; ESP32-S3 であることを明示
    -DBOARD_HAS_PSRAM                ; PSRAM 搭載ボードであることを宣言
    -DCORE_DEBUG_LEVEL=5             ; デバッグログレベル（5=VERBOSE, 開発中のみ）
    -DARDUINO_USB_CDC_ON_BOOT=1      ; Native USB-CDC を有効にする（シリアル出力の鍵）
    -DARDUINO_USB_MODE=1             ; USB モードを CDC に設定（上記と対で必要）

; ライブラリ依存（バージョンをピン留め）
lib_deps =
    m5stack/M5Unified @ ^0.2.15      ; M5Stack 統合ライブラリ（StopWatch 対応は 0.2.15 以降）
    m5stack/M5GFX @ ^0.2.21          ; グラフィックスライブラリ（StopWatch 対応は 0.2.21 以降）
    https://github.com/m5stack/M5PM1.git   ; 電源管理 IC ドライバ（レジストリ有無未確認のため URL 直指定）
    https://github.com/m5stack/M5IOE1.git  ; IO エキスパンダドライバ — AMOLED・タッチ・バイブが M5IOE1 配下の電源レール(L3B)経由で給電されるため公式 lib_deps に含まれている

; [env:m5stack-stopwatch] は実機ビルド用、[env:native] はホスト上でのユニットテスト用である

; ホストテスト用環境（pio test -e native で実行）
[env:native]
platform = native
build_flags =
    -std=c++17
    -DNATIVE_TEST           ; ハードウェア依存コードを切り替えるフラグ
